services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: priorilearn
      POSTGRES_USER: priorilearn
      POSTGRES_PASSWORD: priorilearn
    ports:
      - "5432:5432"
    volumes:
      - priorilearn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorilearn -d priorilearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  priorilearn-postgres:
