services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: priorilearn_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: priorilearn-test-local
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d priorilearn_test"]
      interval: 2s
      timeout: 3s
      retries: 15
