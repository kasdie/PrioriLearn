<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrioriLearn</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #17231f; background: #fbfcfb; }
      body { width: 300px; margin: 0; }
      main { padding: 15px; }
      header, .context, .foot { display: flex; align-items: center; gap: 8px; }
      header { font-size: 14px; font-weight: 800; }
      .mark { width: 25px; height: 25px; display: grid; place-items: center; color: white; background: #176b52; border-radius: 7px; }
      .context { margin-top: 18px; color: #665a90; font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
      h1 { margin: 8px 0 5px; font-size: 17px; line-height: 1.2; }
      p { color: #617067; margin: 0; font-size: 12px; line-height: 1.5; }
      button { width: 100%; border: 0; margin-top: 15px; padding: 10px; color: white; background: #176b52; border-radius: 5px; font-weight: 750; cursor: pointer; }
      button:hover { background: #10523e; }
      .foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e5ebe6; color: #829087; font-size: 9px; }
    </style>
  </head>
  <body>
    <main>
      <header><span class="mark">P</span> priorilearn</header>
      <div class="context" id="context">Checking this tab...</div>
      <h1>Send context for review</h1>
      <p id="context-detail">Nothing is imported until you review and save it in PrioriLearn.</p>
      <button id="open-priorilearn" type="button">Open PrioriLearn</button>
      <div class="foot">Only reads this Canvas tab after you open the extension.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
