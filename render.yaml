services:
  - type: web
    runtime: node
    name: priorilearn-api
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: STRUCTURED_LOGS
        value: "true"
      - key: PERSISTENCE_DRIVER
        value: postgres
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: EXTRACTION_WORKER_INTERVAL_MS
        value: "3000"
      - key: EXTRACTION_WORKER_BATCH_SIZE
        value: "2"
      - key: APP_ORIGIN
        value: https://priori-learn-kasdies-projects.vercel.app
      - key: ENFORCE_ORIGIN_CHECK
        value: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: MAINTENANCE_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ENABLE_DEMO_ACCESS
        value: "false"
      - key: ENABLE_PASSWORD_REGISTRATION
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
